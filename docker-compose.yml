services:
  postgres:
    image: postgres:16-alpine
    container_name: dealflow360-db
    environment:
      POSTGRES_DB: dealflow360
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: dealflow_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealflow -d dealflow360"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: dealflow360-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://dealflow:dealflow_dev@postgres:5432/dealflow360
      JWT_SECRET: dealflow360-dev-secret-min-16-chars!
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      LOG_LEVEL: debug
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/backend/src:/app/src
      - ./src/backend/migrations:/app/migrations

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: dealflow360-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./src/frontend/src:/app/src
      - ./src/frontend/public:/app/public

volumes:
  pgdata:
